# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        # « authenticate » / « logout » : CSRF classique (session) pour la page de connexion sans dépendre du JS.
        # « submit » : reste stateless (formulaires Symfony) — le script csrf_protection_controller.js doit être chargé (app.js).
        stateless_token_ids:
            - submit
