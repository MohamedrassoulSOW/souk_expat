security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                csrf_token_id: authenticate

            logout:
                path: app_logout

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        
        # 1. L'administration reste réservée aux admins
        - { path: ^/admin, roles: ROLE_ADMIN }

        # 2. Les routes publiques (Consultation)
        # On autorise l'accès complet à la consultation des catégories et index
        - { path: ^/annonce/category, roles: PUBLIC_ACCESS }
        - { path: ^/annonce/$, roles: PUBLIC_ACCESS }
        
        # 3. Les routes protégées pour les utilisateurs (Publication / Edition)
        # Ces lignes doivent être APRES les routes publiques
        - { path: ^/annonce/new, roles: ROLE_USER }
        - { path: ^/annonce/mes-annonces, roles: ROLE_USER }
        - { path: ^/annonce/\d+/edit, roles: ROLE_USER }
