security:
    # Les administrateurs héritent des droits éditeur (hors /admin/user réservé à ROLE_ADMIN).
    role_hierarchy:
        ROLE_ADMIN: [ROLE_USER, ROLE_EDITOR]
        ROLE_EDITOR: [ROLE_USER]

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # API mobile — JWT Bearer, sans session / CSRF
        api:
            pattern: ^/api
            stateless: true
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - App\Security\Api\JwtAuthenticator
            entry_point: App\Security\Api\JwtAuthenticator

        main:
            lazy: true
            provider: app_user_provider

            user_checker: App\Security\UserChecker

            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                csrf_token_id: authenticate

            logout:
                path: app_logout
                enable_csrf: true

    access_control:
        # API mobile v1
        - { path: ^/api/v1$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/annonces$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/annonces/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/media/annonce-images/\d+$, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/categories, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/cities, roles: PUBLIC_ACCESS, methods: [GET] }
        - { path: ^/api/v1/me, roles: ROLE_USER }
        - { path: ^/api, roles: ROLE_USER }
        # Réservé au super-admin : tout ce qui est sous /admin/user
        - { path: ^/admin/user, roles: ROLE_ADMIN }
        # Le reste du back-office (annonces, contacts, contenus…) : admin ou éditeur
        - { path: ^/admin, roles: ROLE_EDITOR }
        - { path: ^/dashboard, roles: ROLE_EDITOR }
        - { path: ^/city, roles: ROLE_EDITOR }
        - { path: ^/annonce/category, roles: PUBLIC_ACCESS }
        - { path: ^/annonce/$, roles: PUBLIC_ACCESS }
        - { path: ^/annonce/new, roles: ROLE_USER }
        - { path: ^/annonce/mes-annonces, roles: ROLE_USER }
        - { path: ^/annonce/\d+/edit, roles: ROLE_USER }
        - { path: ^/annonce/admin, roles: ROLE_EDITOR }
