# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    # Session démarrée uniquement si lue/écrite
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

when@prod:
    framework:
        session:
            cookie_secure: true
            cookie_samesite: lax
        # Proxy / HTTPS (Cloudflare, nginx) — définir TRUSTED_PROXIES sur l’hébergeur
        # Ex. TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR
        trusted_proxies: '%env(default::TRUSTED_PROXIES)%'