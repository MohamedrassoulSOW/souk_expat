# config/packages/framework.yaml
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true

    # Session démarrée uniquement si lue/écrite
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

when@prod:
    framework:
        session:
            cookie_secure: true
            cookie_samesite: lax
        # Si HTTPS / IP client incorrects derrière proxy Hostinger/Cloudflare :
        # TRUSTED_PROXIES=127.0.0.1,REMOTE_ADDR dans .env.local
        # puis décommenter :
        # trusted_proxies: '%env(TRUSTED_PROXIES)%'
        # trusted_headers: ['x-forwarded-for', 'x-forwarded-proto', 'x-forwarded-port', 'x-forwarded-host']
